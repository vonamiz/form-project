<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/styles/style.css" />
</head>
<body class="bg-gradient-to-r from-pink-100 to-pink-800 h-screen flex items-center justify-center flex-col">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mb-6">
        <h1 class="text-2xl font-bold text-center text-pink-700">Создать аккаунт</h1>
    </div>
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <p class="text-center text-pink-600 mb-6">Заполните форму ниже, чтобы авторизироваться</p>
        <form class="space-y-6">
            <div>
                <input type="text" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 transition duration-300 ease-in-out" placeholder="Имя пользователя" required>
            </div>
            <div>
                <input type="email" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 transition duration-300 ease-in-out" placeholder="Адрес электронной почты" required>
            </div>
            <div>
                <input type="password" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 transition duration-300 ease-in-out" placeholder="Пароль" required>
            </div>
            <button type="submit" class="w-full bg-pink-500 text-white p-4 rounded-xl hover:bg-pink-700 transition duration-300 ease-in-out">Авторизироваться</button>
        </form>
        <a href="#" class="text-pink-500 text-sm flex justify-end mt-4">
            <i class="fas fa-lock mr-2"></i> Забыли пароль?
        </a>
    </div>
</body>
</html>
